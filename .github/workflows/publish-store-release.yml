name: Publish Store Release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for the next version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate packages and prepare metadata
        id: prep
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: python3 tools/prepare_release.py
      - name: Commit generated Store metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json mgu-store.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Store catalog for ${{ steps.prep.outputs.tag }}"
            git push origin main
          fi
      - name: Publish component releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for artifact in packages/*.tgz; do
            tag="$(basename "$artifact" .tgz)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$artifact" --clobber
              gh release edit "$tag" --draft=false --prerelease=false
            else
              gh release create "$tag" "$artifact" --title "$tag" \
                --notes "MGU Store component $tag" --latest=false
            fi
          done
      - name: Publish Store catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog catalog.json mgu-store.json *.png --clobber
            gh release edit catalog --draft=false --prerelease=false --latest
          else
            gh release create catalog catalog.json mgu-store.json *.png \
              --title "MGU Store catalog" --notes-file release_notes.md --latest
          fi
